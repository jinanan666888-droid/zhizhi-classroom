<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>智智编程助手</title>
<style>
body{margin:0;font-family:Microsoft YaHei;background:#f5f9ff;color:#22324b}
.wrap{width:90%;max-width:1100px;margin:auto;padding:40px}
.hero{text-align:center}
.tag{background:#e5efff;color:#2f6fed;padding:8px 18px;border-radius:20px}
h1{color:#2f6fed}
.panel{background:white;border:1px solid #d8e7ff;border-radius:24px;padding:35px}
h2{text-align:center}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.step{padding:20px;border:1px solid #dce9ff;border-radius:18px;background:#fbfdff}
.num{display:inline-flex;width:38px;height:38px;border-radius:50%;background:#2f6fed;color:white;align-items:center;justify-content:center;font-weight:bold}
.tip{text-align:center;background:#eef5ff;padding:15px;border-radius:15px;margin:20px}
.start{text-align:center}
button{background:#2f6fed;color:white;border:0;border-radius:30px;padding:15px 55px;font-size:18px}
.footer{text-align:center;color:#999;margin-top:25px}
@media(max-width:700px){.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<span class="tag">课堂学习工具</span>
<h1>智智编程助手</h1>
<p>遇到困难不可怕，我们一起把它变成学习的机会。</p>
</div>

<div class="panel">
<h2>使用说明</h2>
<div class="steps">
<div class="step"><span class="num">1</span><h3>开始学习</h3><p>点击开始学习，进入智智编程助手。</p></div>
<div class="step"><span class="num">2</span><h3>选择小组与项目</h3><p>进入智能体后按照提示选择。</p></div>
<div class="step"><span class="num">3</span><h3>选择学习阶段</h3><p>选择识别目标、结对探索或反思迭代。</p></div>
<div class="step"><span class="num">4</span><h3>开始交流</h3><p>和智智编程助手交流问题。</p></div>
</div>

<div class="tip">两位同学使用同一台设备即可。</div>

<div class="start">
<button id="startBtn">开始学习</button>
</div>

</div>
<div class="footer">课堂学习工具 · 智智编程助手</div>
</div>
